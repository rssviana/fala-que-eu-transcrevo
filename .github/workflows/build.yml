name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.10'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências do Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      # whisper-cli estático (sem .dll/.so/.dylib para carregar junto).
      - name: Compilar whisper-cli
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF \
            -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build --config Release --target whisper-cli -j 4
          mkdir -p bin
          if [ "${{ matrix.platform }}" = windows ]; then
            cp whisper.cpp/build/bin/Release/whisper-cli.exe bin/
          else
            cp whisper.cpp/build/bin/whisper-cli bin/
          fi

      - name: Baixar ffmpeg estático
        run: |
          mkdir -p dl bin
          case "${{ matrix.platform }}" in
            windows)
              curl -sSL -o dl/ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
              unzip -q dl/ff.zip -d dl
              cp dl/ffmpeg-*/bin/ffmpeg.exe bin/ ;;
            linux)
              curl -sSL -o dl/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
              tar -xJf dl/ff.tar.xz -C dl
              cp dl/ffmpeg-*/bin/ffmpeg bin/ ;;
            macos)
              curl -sSL -o dl/ff.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
              unzip -q dl/ff.zip -d dl
              cp dl/ffmpeg bin/ ;;
          esac
          chmod +x bin/* || true
          ls -la bin

      - name: Build Flutter
        run: flutter build ${{ matrix.platform }} --release

      - name: Empacotar
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            macos)
              APP=build/macos/Build/Products/Release/Transcritor.app
              mkdir -p "$APP/Contents/Resources/bin"
              cp bin/* "$APP/Contents/Resources/bin/"
              codesign --force --deep -s - "$APP"
              ditto -c -k --keepParent "$APP" dist/Transcritor-macos-arm64.zip ;;
            linux)
              B=build/linux/x64/release/bundle
              mkdir -p "$B/bin" && cp bin/* "$B/bin/"
              tar -czf dist/Transcritor-linux-x64.tar.gz -C "$B" . ;;
            windows)
              B=build/windows/x64/runner/Release
              mkdir -p "$B/bin" && cp bin/* "$B/bin/"
              7z a dist/Transcritor-windows-x64.zip "./$B/*" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Transcritor-${{ matrix.platform }}
          path: dist/*
